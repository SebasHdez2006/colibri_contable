# Configuración base del entorno local.
# Este archivo sólo sirve como respaldo; el usuario puede sobreescribirlo en %USERPROFILE%\.colibri\application.local.properties.
# El puerto 5434 corresponde a la instalación local de PostgreSQL 18 usada en este proyecto.
# URL de conexión usada por la aplicación de escritorio y por las migraciones.
db.url=jdbc:postgresql://127.0.0.1:5434/colibri
# Credenciales de desarrollo creadas por el script de preparación de PostgreSQL.
db.user=colibri
db.password=colibri
# Usuario dedicado a ejecutar Flyway con los mismos permisos del rol local.
db.migrate.user=colibri
db.migrate.password=colibri
